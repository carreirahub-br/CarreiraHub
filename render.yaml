# Blueprint do Render: Web Service (Docker) + PostgreSQL no plano Free.
# Dashboard: New → Blueprint → repositório CarreiraHub.
# O site Free dorme sem visitas. O Postgres Free expira em 30 dias.

databases:
  - name: carreirahub-db
    region: ohio
    plan: free
    postgresMajorVersion: "16"
    databaseName: carreirahub
    user: carreirahub
    ipAllowList: []

services:
  - type: web
    name: carreirahub
    runtime: docker
    plan: free
    region: ohio
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: APP_NAME
        value: CarreiraHub
      - key: AUTO_CREATE_TABLES
        value: "false"
      - key: ADSENSE_ENABLED
        value: "false"
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: carreirahub-db
          property: connectionString
      - key: APP_BASE_URL
        sync: false
      - key: CONTACT_EMAIL
        sync: false
      - key: ADSENSE_CLIENT_ID
        sync: false
      - key: SOCIAL_LINKEDIN_URL
        sync: false
      - key: SOCIAL_INSTAGRAM_URL
        sync: false
      - key: SOCIAL_YOUTUBE_URL
        sync: false
