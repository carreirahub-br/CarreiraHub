services:
  web:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+psycopg://carreirahub:change-me@postgres:5432/carreirahub
      AUTO_CREATE_TABLES: "true"
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: carreirahub
      POSTGRES_USER: carreirahub
      POSTGRES_PASSWORD: change-me
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U carreirahub"]
      interval: 5s
      timeout: 5s
      retries: 8

volumes:
  postgres_data:
