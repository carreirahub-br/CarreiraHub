{% extends "base.html" %}

{% block content %}
<article class="mx-auto max-w-3xl px-4 py-12 lg:px-6">
  <p class="text-xs font-semibold uppercase tracking-wider text-brand">{{ article.category }}</p>
  <h1 class="mt-2 text-3xl font-extrabold tracking-tight">{{ article.title }}</h1>
  {% if article.published_at %}
    <p class="mt-3 text-sm text-muted">
      <time datetime="{{ article.published_at.isoformat() }}">{{ article.published_at | date_br }}</time>
    </p>
  {% endif %}
  {% if article.cover_image %}
    <img class="mt-6 w-full rounded-card" src="{{ article.cover_image }}" alt="" width="800" height="420" decoding="async">
  {% endif %}
  <div class="mt-8 space-y-4 text-base leading-7 text-navy/90">
    {{ article.body | nl2br }}
  </div>
</article>
{% endblock %}
