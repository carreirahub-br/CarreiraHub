{% from "components/icons.html" import svg %}
<article class="flex h-full flex-col rounded-card border border-slate-200 bg-white p-5">
  <span class="flex h-10 w-10 items-center justify-center rounded-xl bg-accent-50 text-navy">
    {{ svg(tool.icon, "h-5 w-5") }}
  </span>
  <h3 class="mt-4 text-base font-semibold">{{ tool.name }}</h3>
  <p class="mt-2 flex-1 text-sm leading-6 text-muted">{{ tool.description }}</p>
  {% if tool.available and tool.path %}
    <a class="mt-5 text-sm font-semibold text-brand hover:underline" href="{{ tool.path }}">{{ tool.cta }}</a>
  {% else %}
    <p class="mt-5 text-sm font-semibold text-muted">{{ tool.cta }}</p>
  {% endif %}
</article>
