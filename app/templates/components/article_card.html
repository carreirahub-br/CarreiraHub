<article class="overflow-hidden rounded-card border border-slate-200 bg-white shadow-sm">
  <a href="{{ article.path }}" class="block">
    {% if article.cover_image %}
      <img
        class="h-44 w-full object-cover"
        src="{{ article.cover_image }}"
        alt=""
        width="640"
        height="176"
        loading="lazy"
        decoding="async"
      >
    {% else %}
      <div class="flex h-44 w-full items-end bg-navy p-4" aria-hidden="true">
        <span class="h-2 w-16 rounded bg-accent"></span>
      </div>
    {% endif %}
  </a>
  <div class="p-5">
    <p class="text-xs font-semibold uppercase tracking-wider text-brand">{{ article.category }}</p>
    <h3 class="mt-2 text-base font-semibold leading-snug">
      <a class="hover:text-brand" href="{{ article.path }}">{{ article.title }}</a>
    </h3>
    <p class="mt-2 text-sm leading-6 text-muted">{{ article.excerpt }}</p>
    {% if article.published_at %}
      <p class="mt-3 text-xs text-muted">
        <time datetime="{{ article.published_at.isoformat() }}">{{ article.published_at | date_br }}</time>
      </p>
    {% endif %}
  </div>
</article>
