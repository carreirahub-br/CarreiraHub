{# Slot de anúncio inativo até ADSENSE_ENABLED e client ID. Não renderiza criativos fictícios. #}
{% if adsense_enabled and slot_id is defined and slot_id %}
<aside class="mx-auto max-w-shell px-4 py-8 lg:px-6" aria-label="Publicidade">
  <p class="mb-2 text-center text-[11px] uppercase tracking-wider text-muted">Publicidade</p>
  <div class="flex min-h-[90px] items-center justify-center overflow-hidden rounded-xl border border-dashed border-slate-200 bg-canvas">
    <ins
      class="adsbygoogle block w-full"
      style="display:block;min-height:90px"
      data-ad-client="{{ adsense_client_id }}"
      data-ad-slot="{{ slot_id }}"
      data-ad-format="auto"
      data-full-width-responsive="true"
    ></ins>
  </div>
</aside>
{% endif %}
