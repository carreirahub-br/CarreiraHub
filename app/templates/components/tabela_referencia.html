{% macro tabela_referencia(tabela) -%}
<div class="rounded-card border border-slate-200 bg-white p-6 shadow-card">
  <h2 class="text-base font-semibold">{{ tabela.title }}</h2>
  <div class="mt-3 overflow-hidden rounded-xl border border-slate-200">
    <div class="grid grid-cols-{{ tabela.columns | length }} gap-0 border-b border-slate-200 bg-canvas">
      {% for column in tabela.columns %}
      <div class="px-3 py-2 text-xs font-semibold text-navy">{{ column }}</div>
      {% endfor %}
    </div>
    {% for row in tabela.rows %}
    <div class="grid grid-cols-{{ tabela.columns | length }} gap-0 border-b border-slate-100">
      {% for cell in row %}
      <div class="px-3 py-2 text-xs leading-6 text-muted">{{ cell }}</div>
      {% endfor %}
    </div>
    {% endfor %}
  </div>
  <p class="mt-3 text-xs leading-6 text-muted">{{ tabela.source }}</p>
</div>
{%- endmacro %}
