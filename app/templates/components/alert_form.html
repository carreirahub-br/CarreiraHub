<div id="alert-form-region">
  {% if success %}
    <div class="rounded-card border border-accent/40 bg-accent-50 p-6" role="status">
      <p class="text-sm font-semibold">Inscrição recebida.</p>
      <p class="mt-2 text-sm leading-6 text-navy/80">
        Enviaremos um e-mail de confirmação antes de qualquer alerta. Você poderá gerenciar preferências e cancelar o recebimento a qualquer momento.
      </p>
      <p class="mt-3 text-sm">
        <a class="font-semibold text-brand hover:underline" href="/alertas/preferencias">Gerenciar preferências</a>
      </p>
    </div>
  {% else %}
    <form
      class="grid gap-4 rounded-card border border-slate-200 bg-white p-5 shadow-sm md:grid-cols-[1fr_14rem_auto]"
      method="post"
      action="/alertas"
      hx-post="/alertas"
      hx-target="#alert-form-region"
      hx-swap="outerHTML"
    >
      <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
      {% if error %}
        <p class="md:col-span-3 rounded-lg bg-red-50 px-3 py-2 text-sm text-red-700" role="alert">{{ error }}</p>
      {% endif %}
      <div>
        <label class="mb-1.5 block text-sm font-medium" for="alert-email">E-mail</label>
        <input class="input" id="alert-email" name="email" type="email" autocomplete="email" required value="{{ email | default('') }}" placeholder="seu@email.com">
      </div>
      <div>
        <label class="mb-1.5 block text-sm font-medium" for="alert-area">Área de interesse</label>
        <select class="input" id="alert-area" name="interest_area">
          {% for option in interest_options %}
            <option value="{{ option.slug }}" {% if interest_area|default('todas') == option.slug %}selected{% endif %}>{{ option.name }}</option>
          {% endfor %}
        </select>
      </div>
      <div class="flex items-end">
        <button class="btn-primary w-full md:w-auto" type="submit">Receber vagas</button>
      </div>
      <div class="md:col-span-3">
        <label class="flex items-start gap-2 text-sm text-muted">
          <input class="mt-1 h-4 w-4 rounded border-slate-300 text-brand" type="checkbox" name="consent" value="1" required>
          <span>
            Concordo em receber alertas de vagas por e-mail e li a
            <a class="font-medium text-brand hover:underline" href="/privacidade">política de privacidade</a>.
          </span>
        </label>
      </div>
    </form>
  {% endif %}
</div>
